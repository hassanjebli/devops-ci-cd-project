{% extends "base.html" %}
{% block title %} · Edit Task{% endblock %}

{% block content %}

<div class="max-w-md mx-auto bg-white rounded-xl shadow-sm p-6">
    <h2 class="text-lg font-semibold mb-4">Edit task</h2>

    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Task title</label>
            <input type="text" name="title"
                   value="{{ task.title }}"
                   class="w-full border rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-slate-900"
                   required>
        </div>

        <button class="w-full bg-slate-900 text-white py-2 rounded-lg hover:bg-slate-800 transition">
            Update Task
        </button>
    </form>

    <a href="/" 
   class="inline-flex items-center gap-2 px-5 py-2.5 mb-6 bg-gradient-to-r from-slate-700 to-slate-900 text-white text-sm font-medium rounded-lg hover:from-slate-800 hover:to-black shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200">
    ← Back to Dashboard
</a>
</div>

{% endblock %}
