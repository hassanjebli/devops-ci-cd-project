<!DOCTYPE html>
<html>
<head>
    <title>Todo CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center items-start p-8">

    <div class="bg-white w-full max-w-4xl p-6 rounded-lg shadow">
        <h1 class="text-2xl font-bold mb-6 text-center">📝 Todo List</h1>

        <a href="/add"
           class="block text-center mb-6 bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
            ➕ Ajouter une tâche
        </a>

        <!-- Tableau avec colonnes séparées -->
        <div class="overflow-x-auto">
            <table class="min-w-full bg-white border border-gray-300">
                <thead>
                    <tr class="bg-gray-200">
                        <th class="py-3 px-4 text-left border-b border-r border-gray-300 font-semibold">Tâche</th>
                        <th class="py-3 px-4 text-center border-b border-gray-300 font-semibold w-48">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for task in tasks %}
                    <tr class="hover:bg-gray-50">
                        <td class="py-3 px-4 border-b border-r border-gray-300">{{ task.title }}</td>
                        <td class="py-3 px-4 border-b border-gray-300 text-center space-x-2">
                            <a href="/edit/{{ task.id }}" 
                               class="inline-block bg-yellow-500 text-white px-3 py-1 rounded hover:bg-yellow-600 text-sm">
                                ✏️ Modifier
                            </a>
                            <a href="/delete/{{ task.id }}" 
                               class="inline-block bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-sm">
                                ❌ Supprimer
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
